# On a `v*` tag: build rbkeeperd for 4 targets, each on its own runner (no cross
# toolchain, no container image), package fixed-name archives, sign SHA256SUMS
# keyless with cosign, attest build provenance, and publish them as this repo's
# release with the workflow's own GITHUB_TOKEN (no PAT, no cross-repo upload).
#
#   https://github.com/all-completed/rb-keeperd/releases/latest/download/<asset>
#
# Verify a download: DEPLOY.md "Install from a release".
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_AUDITABLE_VERSION: "0.7.7"

jobs:
  build:
    name: build (${{ matrix.asset }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { asset: rbkeeperd-linux-x86_64, target: x86_64-unknown-linux-musl, os: ubuntu-24.04, file: "ELF 64-bit LSB .*x86-64" }
          - { asset: rbkeeperd-linux-arm64, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, file: "ELF 64-bit LSB .*ARM aarch64" }
          - { asset: rbkeeperd-macos-arm64, target: aarch64-apple-darwin, os: macos-15, file: "Mach-O 64-bit executable arm64" }
          - { asset: rbkeeperd-macos-x64, target: x86_64-apple-darwin, os: macos-15-intel, file: "Mach-O 64-bit executable x86_64" }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      ASSET: ${{ matrix.asset }}
      FILE_PATTERN: ${{ matrix.file }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag names Cargo.toml's version and a commit on main
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match Cargo.toml version $version"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main"; exit 1; }
      - name: Toolchain (rust-toolchain.toml) + target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          rustc --version
      - name: musl C toolchain (ring)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      - name: Install cargo-auditable
        run: cargo install --locked cargo-auditable --version "$CARGO_AUDITABLE_VERSION"
      - name: cargo test
        run: cargo test --locked --target "$TARGET"
      - name: cargo auditable build --release
        run: cargo auditable build --release --locked --target "$TARGET"
      - name: Ad-hoc code signature (arm64 macOS runs no unsigned code)
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - "target/$TARGET/release/rbkeeperd"
          codesign --verify --verbose "target/$TARGET/release/rbkeeperd"
      - name: Architecture and linkage
        run: |
          out="$(file -b "target/$TARGET/release/rbkeeperd")"
          echo "$out"
          echo "$out" | grep -Eq "$FILE_PATTERN" || { echo "wrong architecture"; exit 1; }
          if [ "$RUNNER_OS" = Linux ]; then
            echo "$out" | grep -Eq 'static(-pie)? linked' || { echo "not statically linked"; exit 1; }
          fi
      - name: "Smoke test: --help, enroll, pubkey, run hardening; Linux: exit 78 on plain swap"
        run: ci/smoke.sh "target/$TARGET/release/rbkeeperd"
      - name: Package
        # Flat archive (no top-level directory), mirroring the repo paths, so DEPLOY.md's
        # commands work from the directory it is extracted into:
        #   mkdir rbkeeperd && tar -xzf <asset> -C rbkeeperd && cd rbkeeperd
        run: |
          stage="dist/stage"
          mkdir -p "$stage/packaging"
          install -m 0755 "target/$TARGET/release/rbkeeperd" "$stage/rbkeeperd"
          install -m 0644 README.md DEPLOY.md SECURITY.md LICENSE "$stage/"
          if [ "$RUNNER_OS" = Linux ]; then
            mkdir -p "$stage/packaging/sysctl.d"
            install -m 0644 packaging/rbkeeperd.service "$stage/packaging/"
            install -m 0644 packaging/sysctl.d/90-rbkeeperd.conf "$stage/packaging/sysctl.d/"
            tar -C "$stage" --owner=0 --group=0 --numeric-owner -czf "dist/$ASSET.tar.gz" .
          else
            mkdir -p "$stage/packaging/macos"
            install -m 0644 packaging/macos/com.allcompleted.rbkeeperd.plist "$stage/packaging/macos/"
            COPYFILE_DISABLE=1 tar -C "$stage" --uid 0 --gid 0 --no-mac-metadata -czf "dist/$ASSET.tar.gz" .
          fi
          tar -tzvf "dist/$ASSET.tar.gz"
          check="$(mktemp -d)"
          tar -xzf "dist/$ASSET.tar.gz" -C "$check"
          [ -x "$check/rbkeeperd" ] || { echo "archive is not flat: no ./rbkeeperd"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: sign, attest, publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release on this repo, with GITHUB_TOKEN
      id-token: write      # keyless cosign + attestation signing (Sigstore OIDC)
      attestations: write  # store the build provenance attestation
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      # The identity cosign binds the SHA256SUMS signature to.
      SIGNER: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: rbkeeperd-*
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          ls -l
          [ "$(ls rbkeeperd-*.tar.gz | wc -l)" = 4 ] || { echo "expected 4 archives"; exit 1; }
          sha256sum rbkeeperd-*.tar.gz | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign SHA256SUMS (keyless; Sigstore bundle = signature + certificate + Rekor entry)
        working-directory: dist
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          # cosign v3 writes only the bundle; the detached signature (base64) and the
          # Fulcio certificate (PEM) the Keeper download page verifies come out of it.
          jq -er '.messageSignature.signature' SHA256SUMS.sigstore.json > SHA256SUMS.sig
          {
            echo '-----BEGIN CERTIFICATE-----'
            jq -er '.verificationMaterial.certificate.rawBytes' SHA256SUMS.sigstore.json | fold -w 64
            echo '-----END CERTIFICATE-----'
          } > SHA256SUMS.pem
          # Both documented forms must verify against this exact workflow and tag.
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          cosign verify-blob --signature SHA256SUMS.sig --certificate SHA256SUMS.pem \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/rbkeeperd-*.tar.gz
            dist/SHA256SUMS
      - name: Publish the release
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "rbkeeperd $TAG" --generate-notes \
            dist/rbkeeperd-*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig dist/SHA256SUMS.pem \
            dist/SHA256SUMS.sigstore.json
      - name: Check the published release
        working-directory: dist
        run: |
          for f in rbkeeperd-*.tar.gz; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
          # Anonymous download URLs the Keeper download page links (200, or 302 to the asset).
          for f in rbkeeperd-linux-x86_64.tar.gz rbkeeperd-linux-arm64.tar.gz rbkeeperd-macos-arm64.tar.gz \
                   rbkeeperd-macos-x64.tar.gz SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem SHA256SUMS.sigstore.json; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$f"
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
            echo "$code $url"
            case "$code" in 200|302) ;; *) exit 1 ;; esac
          done
