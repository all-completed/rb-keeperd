# rb-keeperd: no process may ptrace another — root included — and so none may open
# another's /proc/<pid>/mem. Yama mode 3 cannot be lowered again until the next
# reboot. It closes the "attach a debugger to the daemon" path only; root can still
# reach the daemon's memory other ways (see DEPLOY.md, "What root can still do").
kernel.yama.ptrace_scope = 3
